<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyframe</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="grain"></div>
      <main class="screen screen--settings" aria-labelledby="settings-title">
        <header class="topbar">
          <a class="brand-button" href="index.html">KEY<span>FRAME</span></a>
          <div class="session-title">
            <span class="live-pill">configuration</span>
            <h2 id="settings-title">Settings</h2>
          </div>
          <a class="text-button" href="index.html">Done</a>
        </header>
        <section class="settings-layout">
          <div>
            <p class="eyebrow">03 / game config</p>
            <h2>Set your<br /><em>controls.</em></h2>
            <p class="settings-intro">
              Adjust the original soundtrack and choose a key for each lane.
            </p>
          </div>
          <div class="settings-card">
            <div class="settings-card-heading">
              <span class="card-kicker">rhythm settings</span
              ><span class="card-status"><i></i> ready</span>
            </div>
            <div class="settings-controls">
              <section class="setting-group">
                <div class="setting-title">
                  <span class="setting-number">01</span>
                  <div>
                    <h3>Track volume</h3>
                    <p>Set the level of the original soundtrack.</p>
                  </div>
                  <output id="volume-output">70%</output>
                </div>
                <input
                  id="volume-slider"
                  type="range"
                  min="0"
                  max="100"
                  value="70"
                  aria-label="Master volume"
                />
              </section>
              <section class="setting-group">
                <div class="setting-title">
                  <span class="setting-number">02</span>
                  <div>
                    <h3>Lane keybinds</h3>
                    <p>Select a lane, then press the key you want to use.</p>
                  </div>
                </div>
                <div class="bind-grid rhythm-bind-grid" id="bind-grid"></div>
              </section>
              <button
                class="button button--primary save-settings"
                id="save-settings"
                type="button"
              >
                <span class="button-index">&#10003;</span>Save
                configuration<span class="button-arrow">&#8594;</span>
              </button>
            </div>
          </div>
        </section>
      </main>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <script src="js/settings.js"></script>
  </body>
</html>
